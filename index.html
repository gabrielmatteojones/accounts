<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accesso - Gabriel Jones Portal</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px;">

  <h1>Accedi al portale</h1>

  <div id="login-box">
    <input type="email" id="email" placeholder="Email" style="margin:5px;"><br>
    <input type="password" id="password" placeholder="Password" style="margin:5px;"><br>
    <button id="loginBtn">Login</button>
    <button id="signupBtn">Registrati</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Recupera redirect URL
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get("redirect") || "https://gabrieljones.it/";

    // Se già autenticato, reindirizza
    onAuthStateChanged(auth, user => {
      if (user) {
        window.location.href = redirectUrl;
      }
    });

    // Login
    document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          window.location.href = redirectUrl;
        })
        .catch(error => alert("Errore login: " + error.message));
    });

    // Registrazione
    document.getElementById("signupBtn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          window.location.href = redirectUrl;
        })
        .catch(error => alert("Errore registrazione: " + error.message));
    });
  </script>
</body>
</html>
