<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gabriel Jones Portal</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script>
    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };

    // Inizializzazione Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.getAuth(app);

    // Funzione di login
    function loginUser() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      firebase.signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // Successo: redirect alla pagina successiva
          const user = userCredential.user;
          const previousURL = new URL(document.referrer);
          window.location.href = `gabrieljonesit/services/?URL-Precedente=${encodeURIComponent(previousURL.href)}`;
        })
        .catch((error) => {
          const errorCode = error.code;
          const errorMessage = error.message;
          alert(`Errore: ${errorMessage}`);
        });
    }
  </script>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <input type="email" id="email" class="input-field" placeholder="Email" required>
    <input type="password" id="password" class="input-field" placeholder="Password" required>
    <button class="login-button" onclick="loginUser()">Accedi</button>
