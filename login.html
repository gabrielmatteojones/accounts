<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - Gabriel Jones</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <h2>Login</h2>
  <input id="email" type="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Accedi</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };
    firebase.initializeApp(firebaseConfig);

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        const token = await userCredential.user.getIdToken();

        const redirect = new URLSearchParams(window.location.search).get("redirect");
        const redirectUrl = redirect ? decodeURIComponent(redirect) : "https://gabrieljones.it";

        // Reindirizza con token nella query
        window.location.href = `${redirectUrl}?token=${token}`;
      } catch (error) {
        alert("Errore di login: " + error.message);
      }
    }
  </script>
</body>
</html>
