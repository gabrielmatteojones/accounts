<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Login | Gabriel Jones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Material Web Components -->
  <script type="module" src="https://unpkg.com/@material/web/all.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@material/web/all.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      padding: 40px 32px;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header img {
      width: 48px;
      height: 48px;
      margin-bottom: 8px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 400;
      color: #202124;
      margin: 0;
    }

    md-outlined-text-field {
      width: 100%;
      margin-bottom: 1.5rem;
    }

    md-filled-button {
      width: 100%;
      --md-filled-button-container-color: #1a73e8;
      --md-filled-button-label-text-color: white;
    }

    #error {
      color: #d93025;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Logo">
      <h1>Accedi a Gabriel Jones</h1>
    </div>
    <form id="login-form">
      <md-outlined-text-field
        id="email"
        label="Email"
        type="email"
        required>
      </md-outlined-text-field>

      <md-outlined-text-field
        id="password"
        label="Password"
        type="password"
        required>
      </md-outlined-text-field>

      <md-filled-button type="submit">Avanti</md-filled-button>
    </form>
    <div id="error"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("error");

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;
        const token = await user.getIdToken();

        const redirectURL = new URLSearchParams(window.location.search).get("redirect") || "https://gabrieljones.it";
        window.location.href = `${redirectURL}?token=${token}`;
      } catch (error) {
        errorDiv.textContent = "Email o password non validi.";
      }
    });
  </script>

</body>
</html>
