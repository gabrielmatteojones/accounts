<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accedi | Gabriel Jones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Material Design Lite -->
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    body {
      background: #f1f3f4;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 24px;
    }

    .mdl-textfield {
      width: 100%;
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-title">Accedi a Gabriel Jones</div>
    <form id="login-form">
      <div class="mdl-textfield mdl-js-textfield">
        <input class="mdl-textfield__input" type="email" id="email" required>
        <label class="mdl-textfield__label" for="email">Email</label>
      </div>

      <div class="mdl-textfield mdl-js-textfield">
        <input class="mdl-textfield__input" type="password" id="password" required>
        <label class="mdl-textfield__label" for="password">Password</label>
      </div>

      <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" type="submit" style="width: 100%;">
        Avanti
      </button>
    </form>
    <div id="error"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("error");

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;
        const token = await user.getIdToken();

        const redirectURL = new URLSearchParams(window.location.search).get("redirect") || "https://gabrieljones.it";
        window.location.href = `${redirectURL}?token=${token}`;
      } catch (error) {
        errorDiv.textContent = "Email o password non validi.";
      }
    });
  </script>

</body>
</html>
