<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Login | Gabriel Jones Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Material Web Components -->
  <script type="module" src="https://unpkg.com/@material/web/all.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@material/web/all.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, #1a237e, #0d47a1);
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: #121212;
      padding: 3rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 500;
      color: #ffffff;
    }

    md-outlined-text-field {
      width: 100%;
      margin-bottom: 1.5rem;
      --md-outlined-text-field-container-color: #1e1e1e;
    }

    md-filled-button {
      width: 100%;
      --md-filled-button-container-color: #2979ff;
      --md-filled-button-label-text-color: white;
      margin-top: 0.5rem;
    }

    #error {
      color: #ff5252;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Accedi al Portale</h2>
    <form id="login-form">
      <md-outlined-text-field
        id="email"
        label="Email"
        type="email"
        required>
      </md-outlined-text-field>

      <md-outlined-text-field
        id="password"
        label="Password"
        type="password"
        required>
      </md-outlined-text-field>

      <md-filled-button type="submit">Accedi</md-filled-button>
    </form>
    <div id="error"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("error");

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;
        const token = await user.getIdToken();

        const redirectURL = new URLSearchParams(window.location.search).get("redirect") || "https://gabrieljones.it";
        const urlObj = new URL(redirectURL);

        const safeDomains = [
          ".gabrieljones.it",
          ".gabrielmatteojonesblog.it",
          ".arenagiovani.it"
        ];
        const isSafe = safeDomains.some(domain => urlObj.hostname.endsWith(domain));

        if (!isSafe) {
          errorDiv.textContent = "Dominio di reindirizzamento non autorizzato.";
          return;
        }

        window.location.href = `${redirectURL}?token=${token}`;
      } catch (error) {
        errorDiv.textContent = "Email o password non validi.";
      }
    });
  </script>

</body>
</html>
