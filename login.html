<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Login | Gabriel Jones Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #4e54c8, #8f94fb);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="card p-4">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">Accedi al Portale</h3>
      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <div class="mb-3 text-danger" id="error"></div>
        <button type="submit" class="btn btn-primary w-100">Accedi</button>
      </form>
    </div>
  </div>

  <script>
    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBTU4YncIZH8AFW22xXs0lJad_qulv_nvc",
      authDomain: "gabrieljonesportal.firebaseapp.com",
      projectId: "gabrieljonesportal",
      storageBucket: "gabrieljonesportal.firebasestorage.app",
      messagingSenderId: "773044143707",
      appId: "1:773044143707:web:af838ff6788bf85991e17e",
      measurementId: "G-6V66B6B04Q"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("error");

      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;
        const token = await user.getIdToken();

        const redirectURL = new URLSearchParams(window.location.search).get("redirect") || "https://gabrieljones.it";
        const urlObj = new URL(redirectURL);

        // Verifica domini consentiti tramite suffisso
        const safeDomains = [
          ".gabrieljones.it",
          ".gabrielmatteojonesblog.it",
          ".arenagiovani.it"
        ];
        const isSafe = safeDomains.some(domain => urlObj.hostname.endsWith(domain));

        if (!isSafe) {
          errorDiv.textContent = "Dominio di reindirizzamento non autorizzato.";
          return;
        }

        // Reindirizza con token
        window.location.href = `${redirectURL}?token=${token}`;

      } catch (error) {
        errorDiv.textContent = "Email o password non validi.";
      }
    });
  </script>

</body>
</html>
